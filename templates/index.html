<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pipeline de Sentimentos</title>
    <!-- Bootstrap 5 para um design profissional -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f8f9fa;
      }
      .card {
        border: none;
        border-radius: 12px;
      }
      .loading-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.8);
        z-index: 9999;
        justify-content: center;
        align-items: center;
        flex-direction: column;
      }
      .metrics-val {
        font-weight: bold;
        color: #0d6efd;
      }
      #resultsArea {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Overlay de Carregamento -->
    <div class="loading-overlay" id="loader">
      <div
        class="spinner-border text-primary"
        role="status"
        style="width: 3rem; height: 3rem"
      ></div>
      <h5 class="mt-3">Treinando Pipeline...</h5>
      <p class="text-muted">
        O Optuna está buscando os melhores parâmetros para seu dataset maior.
      </p>
    </div>

    <div class="container py-5">
      <header class="pb-3 mb-4 border-bottom">
        <span class="fs-4"> Pipeline Dinâmico</span>
      </header>

      <div class="row">
        <!-- Coluna de Configuração -->
        <div class="col-lg-4">
          <div class="card shadow-sm p-4">
            <h5 class="mb-4">Configurações</h5>
            <form id="pipelineForm">
              <div class="mb-3">
                <label class="form-label">Dataset (CSV)</label>
                <input
                  type="file"
                  name="dataset"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Vetorização</label>
                <select name="strategy" class="form-select">
                  <option value="TF-IDF">TF-IDF</option>
                  <option value="BoW">Bag of Words (BoW)</option>
                  <option value="TF-IDF+SVD">TF-IDF + SVD (Redução)</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Modelo</label>
                <select name="model" class="form-select">
                  <option value="logistic_regression">
                    Regressão Logística
                  </option>
                  <option value="random_forest">Random Forest</option>
                  <option value="lightgbm">LightGBM</option>
                  <option value="naive_bayes">Naive Bayes</option>
                  <option value="linear_svc">SVM Linear</option>
                </select>
              </div>
              <button
                type="submit"
                class="btn btn-primary w-100 py-2"
                id="btnRun"
              >
                Iniciar Treinamento
              </button>
            </form>
          </div>
        </div>

        <!-- Coluna de Resultados -->
        <div class="col-lg-8">
          <div id="resultsArea">
            <div class="card shadow-sm p-4 mb-4">
              <h5 class="mb-4">Performance no Conjunto de Teste</h5>
              <div class="table-responsive">
                <table class="table table-hover align-middle" id="metricsTable">
                  <thead class="table-light">
                    <tr>
                      <th>Classe</th>
                      <th>Precisão</th>
                      <th>Recall</th>
                      <th>F1-Score</th>
                    </tr>
                  </thead>
                  <tbody>
                    <!-- Preenchido via JS -->
                  </tbody>
                </table>
              </div>
            </div>

            <div class="card shadow-sm p-4">
              <h5 class="mb-3">⚙️ Hiperparâmetros Otimizados</h5>
              <div class="p-3 bg-light rounded border">
                <code id="bestParams" class="text-break"></code>
              </div>
            </div>
          </div>

          <!-- Placeholder inicial -->
          <div id="placeholder" class="text-center py-5 text-muted">
            <p class="fs-5">Aguardando execução do pipeline...</p>
          </div>
        </div>
      </div>
    </div>

    <script>
      document.getElementById("pipelineForm").onsubmit = async (e) => {
        e.preventDefault();

        const loader = document.getElementById("loader");
        const placeholder = document.getElementById("placeholder");
        const resultsArea = document.getElementById("resultsArea");
        const btnRun = document.getElementById("btnRun");
        const tbody = document.querySelector("#metricsTable tbody");
        const paramsCode = document.getElementById("bestParams");

        // Interface em estado de carregamento
        loader.style.display = "flex";
        btnRun.disabled = true;
        resultsArea.style.display = "none";

        try {
          const formData = new FormData(e.target);
          const response = await fetch("/run_pipeline", {
            method: "POST",
            body: formData,
          });

          const data = await response.json();

          if (data.status === 'success') {
            tbody.innerHTML = '';
            
            const results = data.results;
            const metrics = results.metrics;

            for (let key in metrics) {
                if (typeof metrics[key] === 'object') {
                    tbody.innerHTML += `<tr>
                        <td><strong>${key}</strong></td>
                        <td class="metrics-val">${(metrics[key].precision * 100).toFixed(1)}%</td>
                        <td class="metrics-val">${(metrics[key].recall * 100).toFixed(1)}%</td>
                        <td class="metrics-val">${(metrics[key]['f1-score'] * 100).toFixed(1)}%</td>
                    </tr>`;
                }
            }

            // Exibe colunas detectadas e parâmetros
            const colsMsg = `Colunas: <b>${data.detected_cols.text_col}</b> e <b>${data.detected_cols.target_col}</b>`;
            paramsCode.innerHTML = colsMsg + "<br><br>" + JSON.stringify(results.best_params, null, 2);
            
            // Alternar visualização
            placeholder.style.display = "none";
            resultsArea.style.setProperty('display', 'block', 'important');
          } else {
            alert("Erro no Processamento: " + data.message);
          }
        } catch (error) {
          console.error(error);
          alert("Falha na conexão com o servidor. Verifique se o Flask está rodando.");
        } finally {
          loader.style.display = "none";
          btnRun.disabled = false;
        }
      };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
